problem:
  instance: {C: 384, Hstride: 1, M: 384, N: 1, P: 8, Q: 8, R: 11, S: 11, Wstride: 1}
  shape:
    coefficients:
    - {default: 1, name: Wstride}
    - {default: 1, name: Hstride}
    data-spaces:
    - name: Weights
      projection:
      - - [C]
      - - [M]
      - - [R]
      - - [S]
    - name: Inputs
      projection:
      - - [N]
      - - [P, Hstride]
        - [R]
      - - [Q, Wstride]
        - [S]
      - - [C]
    - name: Outputs
      projection:
      - - [N]
      - - [P]
      - - [Q]
      - - [M]
      read-write: true
    dimensions: [C, M, R, S, P, Q, N]
    name: CNN-Layer
