problem:
  instance: {C: 512, M: 512, N: 1, P: 28, Q: 28, R: 1, S: 1}
  shape:
    data-spaces:
    - name: Weights
      projection:
      - - [C]
      - - [M]
      - - [R]
      - - [S]
    - name: Inputs
      projection:
      - - [N]
      - - [P]
        - [R]
      - - [Q]
        - [S]
      - - [C]
    - name: Outputs
      projection:
      - - [N]
      - - [P]
      - - [Q]
      - - [M]
      read-write: true
    dimensions: [C, M, R, S, P, Q, N]
    name: CNN-Layer
